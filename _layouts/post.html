---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.originally %}· originally published on <a href="{{ page.originally.url }}">{{ page.originally.site }}</a>{% endif %}
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/posts/' | relative_url }}">← all posts</a>
  </footer>
</article>
