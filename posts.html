---
layout: default
title: Posts
permalink: /posts/
---
<ul class="post-list">
  {% for post in site.posts %}
  {% assign href = post.link | default: post.url %}
  <li>
    <a href="{{ href | relative_url }}">{{ post.title }}</a>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
  </li>
  {% endfor %}
</ul>
