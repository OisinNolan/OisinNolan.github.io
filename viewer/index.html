---
layout: null
sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer · {{ site.title }}</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 0.75rem; text-align: center; }
  #bar { width: 16rem; height: 4px; background: #8884; border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: currentColor; transition: width 0.15s; }
  #status a { color: inherit; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="status">
  <div id="msg">Loading viewer…</div>
  <div id="bar"><div id="fill"></div></div>
  <a href="{{ '/posts/' | relative_url }}">← all posts</a>
</div>
<script>
// Hugging Face serves large Space files as downloads with a script-blocking CSP,
// so fetch the page (CORS is allowed) and show it from a same-origin blob instead.
const BASE = "{{ site.viewer_base }}";
const name = new URLSearchParams(location.search).get("f") || "";
const msg = document.getElementById("msg");
const fill = document.getElementById("fill");

async function load() {
  // Only plain file names from our own Space, so this page can't be made to render arbitrary HTML.
  if (!/^[A-Za-z0-9_-]+$/.test(name)) throw new Error("No viewer specified.");
  const res = await fetch(`${BASE}/${name}.html`);
  if (!res.ok) throw new Error(`Couldn't load the viewer (HTTP ${res.status}).`);

  const total = Number(res.headers.get("content-length")) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    const mb = (received / 1e6).toFixed(0);
    msg.textContent = total ? `Loading viewer… ${mb} / ${(total / 1e6).toFixed(0)} MB` : `Loading viewer… ${mb} MB`;
    if (total) fill.style.width = `${Math.min(100, (100 * received) / total)}%`;
  }

  msg.textContent = "Starting viewer…";
  const frame = document.createElement("iframe");
  frame.title = name;
  frame.src = URL.createObjectURL(new Blob(chunks, { type: "text/html" }));
  frame.onload = () => document.getElementById("status").remove();
  document.body.append(frame);
}

load().catch(err => {
  msg.textContent = err.message;
  document.getElementById("bar").remove();
});
</script>
</body>
</html>
